plugins {
    id 'com.android.application'
}

android {
    namespace 'com.automirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.automirror.car"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
}
